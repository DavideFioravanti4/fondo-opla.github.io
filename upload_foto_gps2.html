<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aggiungi foto</title>
  <style>
    :root {
      --brand: #2563eb;           /* blu */
      --brand-hover: #1e40af;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #ffffff;
      --danger: #b91c1c;
      --success: #065f46;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: var(--bg);
    }

    .wrapper { max-width: 640px; margin: 0 auto; }

    .label { font-weight: 600; margin-bottom: 8px; }

    .actions {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }

    .btn {
      appearance: none; border: 1px solid var(--brand);
      background: var(--brand); color: #fff;
      padding: 10px 14px; border-radius: 8px;
      font-size: 15px; cursor: pointer;
      transition: background .15s ease, box-shadow .15s ease;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:hover { background: var(--brand-hover); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .btn-outline {
      background: #fff; color: var(--brand);
      border-color: var(--brand);
    }
    .btn-outline:hover { background: #eff6ff; }

    .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .preview {
      margin-top: 14px; border: 1px dashed var(--border);
      border-radius: 10px; padding: 10px; display: none;
    }
    .preview.visible { display: block; }
    .preview-row { display: flex; gap: 12px; align-items: center; }
    .thumb {
      width: 96px; height: 96px; border-radius: 8px; object-fit: cover; background: #f3f4f6; border: 1px solid var(--border);
    }
    .meta { flex: 1; min-width: 0; }
    .meta .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .details { font-size: 12px; color: var(--muted); }

    .row-actions { display: flex; gap: 8px; }

    .status {
      margin-top: 10px; font-size: 13px;
      color: var(--success);
      display: none;
    }
    .status.error { color: var(--danger); }
    .status.visible { display: block; }

    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="label" id="fieldLabel">Aggiungi foto</div>
    <div class="actions">
      <button id="btnPick" type="button" class="btn" aria-describedby="hint">
        <!-- icona camera semplice -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 4l1.5-2h3L15 4h3a3 3 0 013 3v10a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h3z" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        Aggiungi foto
      </button>
      <button id="btnRemove" type="button" class="btn btn-outline" disabled>Rimuovi</button>
    </div>
    <div id="hint" class="hint">
      Puoi scattare una foto o selezionarla dalla galleria. Dimensioni ottimizzate automaticamente.
    </div>

    <input id="fileInput" type="file" accept="image/*" capture="environment" />

    <div id="preview" class="preview" aria-live="polite" aria-atomic="true">
      <div class="preview-row">
        <img id="thumb" class="thumb" alt="Anteprima foto" />
        <div class="meta">
          <div class="name" id="fileName">Nessun file</div>
          <div class="details" id="fileDetails">—</div>
        </div>
        <div class="row-actions">
          <button id="btnRePick" type="button" class="btn btn-outline">Sostituisci</button>
        </div>
      </div>
      <div id="status" class="status" role="status"></div>
    </div>
  </div>

  <script>
    (function () {
      // ====== Parametri di compressione (puoi modificarli) ======
      const MAX_SIDE_PX = 1600;         // lato lungo massimo
      const JPEG_QUALITY = 0.8;         // 0..1
      const TARGET_MIME = 'image/jpeg'; // output forzato in JPEG

      // ====== Riferimenti UI ======
      const fileInput  = document.getElementById('fileInput');
      const btnPick    = document.getElementById('btnPick');
      const btnRemove  = document.getElementById('btnRemove');
      const btnRePick  = document.getElementById('btnRePick');
      const preview    = document.getElementById('preview');
      const thumb      = document.getElementById('thumb');
      const fileNameEl = document.getElementById('fileName');
      const fileDetEl  = document.getElementById('fileDetails');
      const statusEl   = document.getElementById('status');

      // ====== Utils ======
      const fmtBytes = (b) => {
        if (b < 1024) return `${b} B`;
        if (b < 1024*1024) return `${(b/1024).toFixed(1)} KB`;
        return `${(b/1024/1024).toFixed(2)} MB`;
      };

      const resetUI = () => {
        preview.classList.remove('visible');
        statusEl.classList.remove('visible', 'error');
        statusEl.textContent = '';
        thumb.removeAttribute('src');
        fileNameEl.textContent = 'Nessun file';
        fileDetEl.textContent  = '—';
        btnRemove.disabled = true;
      };

      const showStatus = (msg, isError = false) => {
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', !!isError);
        statusEl.classList.add('visible');
      };

      const postToParent = (payload) => {
        try {
          // Invio al parent (Power Apps, iframe, ecc.)
          window.parent && window.parent.postMessage(payload, '*');
        } catch (e) {
          // Ignora se non in iframe
        }
      };

      // ====== Logica principali ======
      btnPick.addEventListener('click', () => fileInput.click());
      btnRePick.addEventListener('click', () => fileInput.click());
      btnRemove.addEventListener('click', () => {
        fileInput.value = '';
        resetUI();
        postToParent({ type: 'photoCleared' });
      });

      fileInput.addEventListener('change', async (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;

        resetUI();
        showStatus('Caricamento e ottimizzazione in corso…');

        try {
          const { dataUrl, width, height, blobSize, mime } = await compressImageFile(file, {
            maxSide: MAX_SIDE_PX,
            quality: JPEG_QUALITY,
            targetMime: TARGET_MIME
          });

          // Aggiorna UI
          thumb.src = dataUrl;
          fileNameEl.textContent = file.name || 'foto.jpg';
          fileDetEl.textContent = `${width}×${height}px • ${fmtBytes(blobSize)} • ${mime}`;
          preview.classList.add('visible');
          btnRemove.disabled = false;
          showStatus('Foto pronta. Puoi procedere al salvataggio.');

          // Post verso il parent (Power Apps ecc.)
          postToParent({
            type: 'photoSelected',
            name: file.name || 'foto.jpg',
            mime,
            width, height,
            blobSize,
            dataUrl // Data URL Base64 pronta da inviare al Flow / API
          });

        } catch (err) {
          console.error(err);
          showStatus('Errore nella lettura/ottimizzazione della foto.', true);
          postToParent({ type: 'photoError', message: String(err && err.message || err) });
        }
      });

      // ====== Funzione di compressione ======
      async function compressImageFile(file, { maxSide, quality, targetMime }) {
        // 1) Leggi come data URL
        const dataUrl = await readFileAsDataURL(file);
        // 2) Crea Image e attende il load
        const img = await loadImage(dataUrl);

        // 3) Calcola nuove dimensioni mantenendo ratio
        let { width, height } = img;
        const isLandscape = width >= height;
        const currentMaxSide = Math.max(width, height);

        let newW = width, newH = height;
        if (currentMaxSide > maxSide) {
          if (isLandscape) {
            newW = maxSide;
            newH = Math.round((height / width) * newW);
          } else {
            newH = maxSide;
            newW = Math.round((width / height) * newH);
          }
        }

        // 4) Disegna su canvas
        const canvas = document.createElement('canvas');
        canvas.width = newW; canvas.height = newH;
        const ctx = canvas.getContext('2d');

        // Migliora qualità di resizing
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        ctx.drawImage(img, 0, 0, newW, newH);

        // 5) Esporta in JPEG (o targetMime)
        const outDataUrl = canvas.toDataURL(targetMime, quality);
        const outBlob = await dataURLToBlob(outDataUrl);
        const blobSize = outBlob.size;

        return { dataUrl: outDataUrl, width: newW, height: newH, blobSize, mime: targetMime };
      }

      // ====== Helper async (File/Blob/Image) ======
      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(file);
        });
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          // Gestione CORS non necessaria per file locali
          img.onload = () => resolve(img);
          img.onerror = (e) => reject(e);
          img.src = src;
        });
      }

      function dataURLToBlob(dataUrl) {
        return fetch(dataUrl).then(r => r.blob());
      }

      // ====== Annuncia presenza al parent (facoltativo) ======
      postToParent({ type: 'ready', component: 'aggiungi-foto', version: '1.0.0' });
    })();
  </script>
</body>
</html>
